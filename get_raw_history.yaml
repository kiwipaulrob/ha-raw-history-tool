#
# get_raw_history.yaml — Raw Entity State History Tool for Home Assistant
# Copy this file to /config/packages/ and add hass_token to secrets.yaml
# ==============================================================================
rest_command:
  get_raw_history_api:
    url: "http://localhost:8123/api/history/period/{{ start_time }}?filter_entity_id={{ entity_id }}&end_time={{ end_time }}&minimal_response=true&significant_changes_only=true"
    method: GET
    headers:
      Authorization: *** !secret hass_token"
      Content-Type: "application/json"
    timeout: 15

python_script:

script:
  get_raw_history:
    alias: Get Raw State History
    description: Returns raw state changes for any entity type over a time period.
    fields:
      entity_id:
        description: "Full entity ID (e.g. cover.curtain)"
        required: true
        selector:
          text: null
      start_time:
        description: "ISO 8601 start (optional, defaults to 24h ago)"
        required: false
        selector:
          text: null
      end_time:
        description: "ISO 8601 end (optional, defaults to now)"
        required: false
        selector:
          text: null
      debug:
        description: "Enable verbose tracing"
        required: false
        selector:
          boolean:
    sequence:
      - action: python_script.get_raw_history
        data:
          entity_id: "{{ entity_id }}"
          start_time: "{{ start_time | default('') }}"
          end_time: "{{ end_time | default('') }}"
          debug: "{{ debug | default(false) }}"
        response_variable: history_result
      - stop: "{{ history_result }}"

intent_script:
  GetRawHistory:
    alias: Get Raw State History for an Entity
    action:
      - variables:
          use_ids: "{{ name | default(entity_id | default('')) }}"
          use_start: "{{ start_time | default('') }}"
          use_end: "{{ end_time | default('') }}"
      - service: script.get_raw_history
        data:
          entity_id: "{{ use_ids }}"
          start_time: "{{ use_start }}"
          end_time: "{{ use_end }}"
